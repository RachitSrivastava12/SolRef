name: Reference content feedback
description: Report a confusing explanation, stale source, or example that does not work.
title: "[Content] "
labels:
  - content-feedback
body:
  - type: input
    id: page
    attributes:
      label: Page or learning track
      description: Include the page title or URL.
      placeholder: AccountsDB, Execution Hot Path, or a page URL
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to understand or do?
      description: A short task helps us tell whether the page supports the intended learning outcome.
    validations:
      required: true
  - type: textarea
    id: stuck
    attributes:
      label: Where did you get stuck?
      description: Paste the sentence, diagram, source, or example that caused trouble.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Example environment, if relevant
      description: Add SDK/tool versions, network, and any error output for a code example.
    validations:
      required: false
  - type: textarea
    id: suggested_change
    attributes:
      label: Suggested correction or missing context
    validations:
      required: false
